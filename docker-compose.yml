name: hrms

x-php: &php
  image: hrms-php
  build:
    context: docker/php
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB}
    DB_USERNAME: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --save ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: UTC
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs as root so the macOS bind mount stays writable; dev only.
  # php-fpm (the image default CMD) listens on 9000 for nginx; the workers and
  # scheduler below reuse this image and mount.
  app:
    <<: *php
    working_dir: /var/www/html

  # Only nginx publishes the API port; Vite proxies /api to it.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Queue workers in the CRM's priority split: one service per queue so a busy
  # `maintenance` queue cannot starve `critical`. No jobs exist yet.
  worker-critical:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical", "--tries=3"]

  worker-pdf:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=pdf", "--tries=3"]

  worker-reports:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=reports", "--tries=3"]

  worker-maintenance:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=maintenance", "--tries=3"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

volumes:
  postgres-data:
  redis-data:
