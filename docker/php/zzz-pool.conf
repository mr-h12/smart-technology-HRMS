; Dev pool override (loaded after www.conf / zz-docker.conf). Production sizes this
; from the server's RAM. Children stay warm (min_spare 4) so a burst of parallel
; requests is not delayed by fpm's slow child spawning.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
